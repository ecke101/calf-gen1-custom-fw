version = 1

[[annotations]]
path = [
  ".clang-tidy",
  ".gitattributes",
  ".github/**",
  ".gitignore",
  "Makefile",
  "NOTICE",
  "PROVENANCE.md",
  "README.md",
  "REUSE.toml",
  "THIRD_PARTY_LICENSES.md",
  "docs/**",
  "ngcd/Makefile",
  "ngcd/include/**",
  "ngcd/profiles/**",
  "ngcd/src/**",
  "ngcd/target_include/**",
  "ngcd/tests/**",
  "pyproject.toml",
  "scripts/**",
  "src/**",
  "tests/**",
  "tools/**",
  "ui/Makefile",
  "ui/include/**",
  "ui/src/**",
  "ui/tests/**",
  "ui/third_party/README.md",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Erik Abrahamsson"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "ngcd/vendor/libxaac/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "The Android Open Source Project and upstream contributors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "ngcd/vendor/vo-aacenc/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "VisualOn and upstream contributors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = [
  "ui/assets/fonts/*.ttf",
  "ui/assets/fonts/OFL.txt",
]
precedence = "override"
SPDX-FileCopyrightText = "2018 The Noto Project Authors"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "ui/assets/fonts/README.md"
precedence = "override"
SPDX-FileCopyrightText = "2026 Erik Abrahamsson"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "ui/third_party/stb/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2017 Sean Barrett"
SPDX-License-Identifier = "MIT"
